            <span id="priceDelta" class="stock-toolbar__delta">—</span>

          <input class="stock-toolbar__input" type="number" id="qty" placeholder="Enter QTY" min="1" />

          <div class="stock-toolbar__actions">
            <button class="btn btn--buy" id="buyBtn">BUY</button>
            <button class="btn btn--sell" id="sellBtn">SELL</button>
          </div>
        </section>

        <section class="chart">
          <div class="chart__yLabel">Height: 500px</div>

          <div class="chart__box" id="chartBox">
            <div class="chart__grid" aria-hidden="true"></div>
            <div class="chart__bars" id="bars"></div>

            <div class="chart__xAxis">
              <span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span>
            </div>
          </div>
        </section>
      </main>

      <aside class="dashboard__side">
        <h3 class="history__title">History</h3>
        <div class="history" id="historyList"></div>
      </aside>
